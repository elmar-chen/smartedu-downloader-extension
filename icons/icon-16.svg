<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Dark Jade Background -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="#023a2f" stroke="#34D399" stroke-width="0.7" stroke-opacity="0.5"/>

  <!-- 1. Golden Auspicious Cloud Bar -->
  <path d="M 2 13.5 C 4.5 12.8, 11.5 12.8, 14 13.5 C 14.2 14.5, 1.8 14.5, 2 13.5 Z" fill="#F59E0B" />
  <circle cx="2" cy="12.5" r="1.3" fill="#FBBF24" />
  <circle cx="14" cy="12.5" r="1.3" fill="#FBBF24" />

  <!-- 2. Bold Open Book (Pure White) -->
  <path d="M 2 10.2 C 4.5 9.5, 6.5 10.3, 8 11.3 C 9.5 10.3, 11.5 9.5, 14 10.2 L 14 12.8 C 11.5 12, 9.5 12.8, 8 13.5 C 6.5 12.8, 4.5 12, 2 12.8 Z" 
        fill="#FFFFFF" />

  <!-- 3. Solid High-Contrast Download Arrow (Pure White) -->
  <path d="M 6.5 1.5 
           L 9.5 1.5 
           L 9.5 5 
           L 12.5 5 
           L 8 9.8 
           L 3.5 5 
           L 6.5 5 Z" 
        fill="#FFFFFF" />
  <!-- 1px Mint Core for subtle depth -->
  <line x1="8" y1="2.5" x2="8" y2="6.5" stroke="#059669" stroke-width="1" stroke-linecap="round" />
</svg>