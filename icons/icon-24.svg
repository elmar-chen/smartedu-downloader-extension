  <!-- Golden Auspicious Cloud Base with Ruyi Lobes -->
  <path d="M 3.5 19 C 5 17, 8.5 18, 12 19.5 C 15.5 18, 19 17, 20.5 19 C 21.5 20, 20.5 22, 18.5 22 C 15.5 22.5, 8.5 22.5, 5.5 22 C 3.5 22, 2.5 20, 3.5 19 Z" fill="url(#gold24)" />
