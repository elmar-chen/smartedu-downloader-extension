<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Google Colors -->
    <!-- Google Green Palette -->
    <linearGradient id="bookCoverL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#1E8E3E" />
    </linearGradient>
    <linearGradient id="bookCoverR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E8E3E" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>

    <!-- Google Yellow/Amber Palette for Auspicious Cloud -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FEE75C" />
      <stop offset="40%" stop-color="#FBBC04" />
      <stop offset="100%" stop-color="#F29900" />
    </linearGradient>

    <!-- Google Blue Palette for Arrow -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#669DF6" />
      <stop offset="50%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>

    <!-- Subtle, light Material Drop Shadow (Natural elevation) -->
    <filter id="matElevation" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#202124" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#matElevation)">
    <!-- 1. Auspicious Cloud (盛世祥云 - 优雅托举书本，云头向上环抱) -->
    <!-- Central Cloud Base -->
    <path d="M 36 94
             C 24 93, 16 100, 20 108
             C 24 115, 36 117, 46 115
             C 52 118, 60 119, 64 119
             C 68 119, 76 118, 82 115
             C 92 117, 104 115, 108 108
             C 112 100, 104 93, 92 94
             C 84 89, 74 91, 64 96
             C 54 91, 44 89, 36 94 Z"
          fill="url(#cloudGrad)" />

    <!-- Left Cloud Ruyi Arm (左侧如意云头 - 优雅向上内卷) -->
    <path d="M 22 95
             C 12 90, 8 76, 17 68
             C 26 60, 36 67, 34 76
             C 32 82, 26 86, 20 86
             C 17 86, 15 82, 18 79
             C 21 76, 26 78, 26 81"
          fill="none" stroke="url(#cloudGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Cloud Ruyi Arm (右侧如意云头 - 优雅向上内卷) -->
    <path d="M 106 95
             C 116 90, 120 76, 111 68
             C 102 60, 92 67, 94 76
             C 96 82, 102 86, 108 86
             C 111 86, 113 82, 110 79
             C 107 76, 102 78, 102 81"
          fill="none" stroke="url(#cloudGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Cloud Surface Highlight Ribbons (灵动金云高光线) -->
    <path d="M 44 107 C 54 104, 74 104, 84 107" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
    <path d="M 21 74 C 23 71, 28 72, 29 76" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <path d="M 107 74 C 105 71, 100 72, 99 76" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />

    <!-- 2. The Open Book (书本 - Google Material 质感开卷) -->
    <!-- Under Cover Shadow / Fold Depth -->
    <path d="M 20 84
             C 36 81, 52 84, 64 91
             C 76 84, 92 81, 108 84
             C 92 89, 76 94, 64 101
             C 52 94, 36 89, 20 84 Z"
          fill="#137333" opacity="0.35" />

    <!-- Left Book Cover Wing (左侧书壳) -->
    <path d="M 18 51
             C 36 47, 52 51, 64 59
             L 64 91
             C 52 83, 36 79, 18 83 Z"
          fill="url(#bookCoverL)" />

    <!-- Left White Inner Page (左侧书页高光纸张) -->
    <path d="M 22 55
             C 37 51, 51 55, 61 62
             L 61 87
             C 51 81, 37 77, 22 80 Z"
          fill="#FFFFFF" />
    <!-- Left Page Minimal Text Lines -->
    <line x1="29" y1="65" x2="52" y2="69" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round" />
    <line x1="29" y1="73" x2="47" y2="77" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Book Cover Wing (右侧书壳) -->
    <path d="M 110 51
             C 92 47, 76 51, 64 59
             L 64 91
             C 76 83, 92 79, 110 83 Z"
          fill="url(#bookCoverR)" />

    <!-- Right White Inner Page (右侧书页高光纸张) -->
    <path d="M 106 55
             C 91 51, 77 55, 67 62
             L 67 87
             C 77 81, 91 77, 106 80 Z"
          fill="#FFFFFF" />
    <!-- Right Page Minimal Text Lines -->
    <line x1="99" y1="65" x2="76" y2="69" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round" />
    <line x1="99" y1="73" x2="81" y2="77" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round" />

    <!-- Spine Valley Crease (中缝立体线) -->
    <line x1="64" y1="59" x2="64" y2="92" stroke="#137333" stroke-width="1.8" />

    <!-- 3. Modern Flat Download Arrow (Google Blue 下行箭头) -->
    <path d="M 52 14
             L 76 14
             L 76 38
             L 94 38
             L 64 68
             L 34 38
             L 52 38 Z"
          fill="url(#arrowGrad)"
          stroke="#FFFFFF"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Modern Subtle Geometric Bevel Highlight (几何流光折角) -->
    <path d="M 64 16 L 64 65 L 36 38 L 52 38 L 52 16 Z" fill="#FFFFFF" opacity="0.22" />
  </g>
</svg>