<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Jade to Vibrant Emerald -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023a2f" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Imperial Gold Gradient for Cloud -->
    <linearGradient id="goldCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Cloud Rim Light -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>

    <!-- Book Page Gradient (Left: curved shadow to light) -->
    <linearGradient id="pLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Book Page Gradient (Right: light to shadow) -->
    <linearGradient id="pRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="75%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Download Arrow Gradient: Vibrant Mint/Emerald with crisp top gloss -->
    <linearGradient id="arrowG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="40%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#011e18" flood-opacity="0.5"/>
    </filter>
    <filter id="arrowShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#011e18" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Background Badge: Modern Squircle with subtle border glow -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#6EE7B7" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- 2. Traditional Auspicious Cloud (盛世祥云底座 - 左右如意卷云纹) -->
  <g filter="url(#shadow3d)">
    <!-- Base Cloud Main Pillow -->
    <path d="M 32 94 
             C 22 94, 16 100, 18 107 
             C 20 113, 28 116, 36 115 
             C 42 119, 53 120, 64 116 
             C 75 120, 86 119, 92 115 
             C 100 116, 108 113, 110 107 
             C 112 100, 106 94, 96 94 
             C 90 89, 78 90, 73 95 
             C 68 91, 60 91, 55 95 
             C 50 89, 38 89, 32 94 Z" 
          fill="url(#goldCloud)" />

    <!-- Left Auspicious Ruyi Spiral (左侧如意如云卷) -->
    <path d="M 17 83 
             C 10 82, 8 90, 13 95 
             C 18 99, 27 98, 29 92 
             C 31 85, 23 81, 17 83 Z" fill="url(#goldCloud)" />
    <!-- Left Ruyi Inward Curl Line -->
    <path d="M 16 88 C 21 86, 26 89, 24 94 C 23 96, 19 96, 18 94" 
          fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Auspicious Ruyi Spiral (右侧如意如云卷) -->
    <path d="M 111 83 
             C 118 82, 120 90, 115 95 
             C 110 99, 101 98, 99 92 
             C 97 85, 105 81, 111 83 Z" fill="url(#goldCloud)" />
    <!-- Right Ruyi Inward Curl Line -->
    <path d="M 112 88 C 107 86, 102 89, 104 94 C 105 96, 109 96, 110 94" 
          fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

    <!-- Base Cloud Swirl Details (云气流动回纹) -->
    <path d="M 42 107 C 48 103, 56 106, 54 111 C 53 113, 49 113, 48 111" 
          fill="none" stroke="#78350F" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <path d="M 86 107 C 80 103, 72 106, 74 111 C 75 113, 79 113, 80 111" 
          fill="none" stroke="#78350F" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 3. The Open Book (盛开的教科书 - 优雅曲面) -->
  <g filter="url(#shadow3d)">
    <!-- Book Spine / Cover Depth -->
    <path d="M 21 83 
             C 38 86, 54 91, 64 97 
             C 74 91, 90 86, 107 83 
             L 107 87 
             C 90 90, 74 95, 64 101 
             C 54 95, 38 90, 21 87 Z" 
          fill="#01241C" />

    <!-- Left Book Page -->
    <path d="M 22 52 
             C 38 49, 54 53, 64 60 
             L 64 96 
             C 54 89, 38 84, 22 81 Z" 
          fill="url(#pLeft)" />
    <!-- Left Page Layer Depth (书页厚度边) -->
    <path d="M 22 81 L 22 84.5 C 38 87.5, 54 92.5, 64 98.5 L 64 96 C 54 89, 38 84, 22 81 Z" fill="#94A3B8" />

    <!-- Left Page Text Impression Lines (书本墨香横线) -->
    <line x1="30" y1="62" x2="56" y2="67" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />
    <line x1="30" y1="69" x2="52" y2="74" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />
    <line x1="30" y1="76" x2="48" y2="81" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />

    <!-- Right Book Page -->
    <path d="M 106 52 
             C 90 49, 74 53, 64 60 
             L 64 96 
             C 74 89, 90 84, 106 81 Z" 
          fill="url(#pRight)" />
    <!-- Right Page Layer Depth (书页厚度边) -->
    <path d="M 106 81 L 106 84.5 C 90 87.5, 74 92.5, 64 98.5 L 64 96 C 74 89, 90 84, 106 81 Z" fill="#94A3B8" />

    <!-- Right Page Text Impression Lines -->
    <line x1="98" y1="62" x2="72" y2="67" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />
    <line x1="98" y1="69" x2="76" y2="74" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />
    <line x1="98" y1="76" x2="80" y2="81" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />

    <!-- Central Page Valley Crease (中缝立体阴影) -->
    <line x1="64" y1="60" x2="64" y2="97" stroke="#475569" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 4. Dynamic Download Arrow (动感贯穿下载箭头) -->
  <g filter="url(#arrowShadow)">
    <!-- Arrow Body: Crisp Outline for Outstanding Pop -->
    <path d="M 52 14 
             L 76 14 
             L 76 38 
             L 93 38 
             L 64 67 
             L 35 38 
             L 52 38 Z" 
          fill="url(#arrowG)" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linejoin="round" />
    
    <!-- Central Ridge Highlight (箭头立体脊线) -->
    <line x1="64" y1="18" x2="64" y2="52" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>